services:
- type: web
  runtime: node
  plan: standard
  name: cup-of-sugar-be
  rootDir: backend
  buildCommand: npm install && npm run typeorm migration:run -- -d src/data-source.ts
  startCommand: npx @nestjs/cli start
  envVars:
    - key: NODE_ENV
      value: production
    - key: NODE_VERSION
      value: 22.12.0
    - key: PORT
      value: "4000"
    - key: DATABASE_HOST
      fromDatabase:
        name: cup-of-sugar-db
        property: host
    - key: DATABASE_PORT
      fromDatabase:
        name: cup-of-sugar-db
        property: port
    - key: DATABASE_USER
      fromDatabase:
        name: cup-of-sugar-db
        property: user
    - key: DATABASE_PASSWORD
      fromDatabase:
        name: cup-of-sugar-db
        property: password
    - key: DATABASE_NAME
      fromDatabase:
        name: cup-of-sugar-db
        property: database
    - key: CLIENT_URL
      value: https://cup-of-sugar.onrender.com
    - fromGroup: Cup of Sugar Production
- type: web
  name: cup-of-sugar
  runtime: static
  rootDir: frontend
  staticPublishPath: dist
  routes:
  - type: rewrite
    source: /*
    destination: /index.html
  envVars:
    - key: BASE_URL
      value: https://cup-of-sugar-be.onrender.com
    - key: NODE_ENV
      value: production

databases:
  - name: cup-of-sugar-db
    databaseName: cup_of_sugar_runners
    user: cup_of_sugar_prod
    plan: basic-256mb

