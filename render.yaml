services:
- type: web
  runtime: node
  plan: standard
  name: gig-booker-be
  rootDir: backend
  buildCommand: npm install && npm run typeorm migration:run -- -d src/data-source.ts
  startCommand: npx @nestjs/cli start
  envVars:
    - key: NODE_ENV
      value: production
    - key: NODE_VERSION
      value: 22.12.0
    - key: PORT
      value: "4000"
    - key: DATABASE_HOST
      fromDatabase:
        name: gig-booker-db
        property: host
    - key: DATABASE_PORT
      fromDatabase:
        name: gig-booker-db
        property: port
    - key: DATABASE_USER
      fromDatabase:
        name: gig-booker-db
        property: user
    - key: DATABASE_PASSWORD
      fromDatabase:
        name: gig-booker-db
        property: password
    - key: DATABASE_NAME
      fromDatabase:
        name: gig-booker-db
        property: database
    - key: CLIENT_URL
      value: https://gig-booker.onrender.com
    - fromGroup: Gig Booker Production
- type: web
  name: gig-booker
  runtime: static
  rootDir: frontend
  staticPublishPath: dist
  routes:
  - type: rewrite
    source: /*
    destination: /index.html
  envVars:
    - key: BASE_URL
      value: https://gig-booker-be.onrender.com
    - key: NODE_ENV
      value: production

databases:
  - name: gig-booker-db
    databaseName: gig_booker_runners
    user: gig_booker_prod
    plan: basic-256mb

